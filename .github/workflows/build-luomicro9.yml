name: Build LuoMicro v9 ISO

on:
  workflow_dispatch: {}

concurrency:
  group: luomicro9
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            Write-Host ("{0}: free {1:N1} GB" -f $_.Name, ($_.Free/1GB))
          }

      - name: Config - build ISO
        shell: powershell
        working-directory: build
        run: |
          $p = "ConvertConfig.ini"
          (Get-Content $p) `
            -replace '^wim2esd\s*=.*','wim2esd      =0' `
            -replace '^SkipISO\s*=.*','SkipISO      =0' `
            -replace '^AutoStart\s*=.*','AutoStart    =1' `
            -replace '^AutoExit\s*=.*','AutoExit     =1' `
            -replace '^AddUpdates\s*=.*','AddUpdates   =1' `
            -replace '^Cleanup\s*=.*','Cleanup      =0' |
            Set-Content $p
          Get-Content $p

      - name: Download UUP and build base ISO
        shell: cmd
        working-directory: build
        run: |
          uup_download_windows.cmd 49127c4b-02dc-482e-ac4f-ec4d659b7547

      - name: Extract base ISO
        shell: powershell
        run: |
          $iso = Get-ChildItem -Path build -Recurse -Filter *.iso | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $iso) { throw "base iso not found" }
          Write-Host ("BASE ISO: {0} {1:N2} GB" -f $iso.FullName, ($iso.Length/1GB))
          New-Item -ItemType Directory -Force -Path D:\iso | Out-Null
          & 7z x -y -o"D:\iso" $iso.FullName | Select-Object -Last 5
          Get-ChildItem D:\iso\sources\install.* | Select-Object Name,Length

      - name: Debloat offline (LuoMicro v9)
        shell: powershell
        run: |
          $wim = Get-ChildItem D:\iso\sources -Filter install.wim | Select-Object -First 1
          if (-not $wim) { throw "install.wim missing in ISO" }
          Write-Host ("WIM: {0} {1:N2} GB" -f $wim.FullName, ($wim.Length/1GB))
          ./scripts/debloat-v9.ps1 -WimPath $wim.FullName -MountDir "D:\mount9" -LogFile "D:\debloat9.log"

      - name: Export to ESD inside ISO tree
        shell: powershell
        run: |
          $src = "D:\iso\sources\install.wim"
          $dst = "D:\iso\sources\install.esd"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          dism /Export-Image /SourceImageFile:$src /SourceIndex:1 /DestinationImageFile:$dst /Compress:recovery /CheckIntegrity
          if ($LASTEXITCODE -ne 0) { throw "export esd failed $LASTEXITCODE" }
          Remove-Item $src -Force
          Get-ChildItem D:\iso\sources\install.* | ForEach-Object { Write-Host ("{0}  {1:N2} GB" -f $_.Name, ($_.Length/1GB)) }

      - name: Get oscdimg
        shell: powershell
        run: |
          $o = Get-ChildItem -Path build -Recurse -Filter oscdimg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($o) { Write-Host ("oscdimg: " + $o.FullName) }
          else {
            Write-Host "oscdimg not bundled, installing ADK oscdimg"
            choco install -y --no-progress windows-adk-oscdimg
            $o = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg" -Filter oscdimg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($o) { Write-Host ("oscdimg: " + $o.FullName) }
          }
          if ($o) { "OSCDIMG=" + $o.FullName | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Build final ISO
        shell: powershell
        run: |
          $b = "D:\iso\boot\etfsboot.com"
          $e = "D:\iso\efi\microsoft\boot\efiisoboot.bin"
          if (-not (Test-Path $e)) {
            $alt = Get-ChildItem "D:\iso\efi\microsoft\boot" -Filter "efi*.bin" -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
            if ($alt) { $e = $alt.FullName }
          }
          if (-not (Test-Path $b)) { throw "etfsboot.com missing" }
          if (-not (Test-Path $e)) { throw "efi boot bin missing" }
          Write-Host ("BIOS boot: " + $b)
          Write-Host ("UEFI boot: " + $e)
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          $out = "$env:GITHUB_WORKSPACE\out\LuoMicro9_26300.10066_zh-cn_Pro.iso"
          & $env:OSCDIMG -m -o -u2 -udfver102 "-bootdata:2#p0,e,b$b#pEF,e,b$e" "D:\iso" $out
          if ($LASTEXITCODE -ne 0) { throw "oscdimg failed $LASTEXITCODE" }
          Get-Item $out | ForEach-Object { Write-Host ("FINAL ISO: {0:N2} GB" -f ($_.Length/1GB)) }

      - name: Fallback ESD export
        if: failure()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          if (Test-Path D:\iso\sources\install.esd) {
            Copy-Item D:\iso\sources\install.esd "$env:GITHUB_WORKSPACE\out\LuoMicro9_26300.10066_zh-cn_Pro.esd" -Force
          }
          Copy-Item D:\debloat9.log "$env:GITHUB_WORKSPACE\out\debloat9.log" -Force -ErrorAction SilentlyContinue

      - name: Locate output
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          Copy-Item D:\debloat9.log "$env:GITHUB_WORKSPACE\out\debloat9.log" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:GITHUB_WORKSPACE\out" | ForEach-Object { Write-Host ("FINAL: {0}  {1:N2} GB" -f $_.Name, ($_.Length/1GB)) }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luomicro9-iso
          path: out/*
          compression-level: 0
          retention-days: 3
