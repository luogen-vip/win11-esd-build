name: Publish Lite ESD release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download lite ESD artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: install-esd-lite-26300.10066
          run-id: 43839721633
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: in

      - name: Inspect files
        run: |
          ls -la in
          find in -name "*.esd" -exec ls -l {} \;

      - name: Split into raw binary parts
        run: |
          mkdir -p out
          ESD=$(find in -name "*.esd" | head -1)
          echo "source: $ESD"
          split -b 1800M -d -a 2 --additional-suffix=.part "$ESD" out/install_lite_26300.10066.esd.
          sha256sum "$ESD" | awk '{print $1"  install_lite_26300.10066.esd"}' > out/SHA256.txt
          cp "docs/合并说明.txt" "out/合并说明.txt"
          cp in/optimize.log out/optimize.log
          ls -lh out

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete lite-esd-26300.10066 --yes --cleanup-tag 2>/dev/null || true
          gh release create lite-esd-26300.10066 \
            --title "Windows 11 26H2 LITE install.esd (26300.10066 zh-cn Pro)" \
            --notes "分片下载后按 合并说明.txt 用 copy /b 合并成 install.esd，免登录下载。" \
            --latest \
            out/*
